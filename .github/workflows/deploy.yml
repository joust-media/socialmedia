name: Deploy to GoDaddy

# Deploys the site to GoDaddy over FTP whenever code is pushed to `main`.
# You can also trigger it manually from the Actions tab.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync files to GoDaddy via FTP
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # These three values come from GitHub repo Secrets (Settings > Secrets and variables > Actions).
          # Never hard-code credentials in this file.
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          # The folder on the GoDaddy server to deploy into (public URL
          # https://joustmedia.com/portal/). The FTP account's root IS the
          # site's document root (its root listing contains css/, js/, images/,
          # media/ and the live portal/ folder), so paths here are relative to
          # it. Do NOT prefix with public_html/ - that creates a bogus nested
          # folder and never touches the live site.
          # Deploys are scoped to portal/ and never touch the rest of the site.
          # (The folder was renamed from socialmedia/ -> portal/; the old folder
          # only holds the redirect kit from redirect-old-folder/.)
          server-dir: portal/

          # Upload from the repository root.
          local-dir: ./

          # Protect files/folders that must NEVER be overwritten or deleted on the live server:
          #   - .git and CI files (not part of the site)
          #   - config.php holds the LIVE database credentials
          #   - uploads/ holds client-uploaded images and is not tracked in git
          #   - .htaccess lives on the server (controls site routing/PHP config) and is not tracked in the repo
          #   - redirect-old-folder/ is the kit for the OLD socialmedia/ folder, placed there by hand
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            config.php
            uploads/**
            .htaccess
            **/.htaccess
            error_log
            README.md
            redirect-old-folder/**
